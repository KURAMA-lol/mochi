name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fetch LivLiv Player and Nana (not stored in this repo)
        run: |
          git clone https://github.com/livliv-dev/player /tmp/livliv
          git -C /tmp/livliv checkout 91cd1f7b2cf2290977ccccbc2fe47dc555963045
          sed -i 's/^    if (!text) return$/    return/' /tmp/livliv/src/mark.ts
          grep -n '^    return$' /tmp/livliv/src/mark.ts
          mkdir -p app/src/main/assets/nana/model
          cp -r /tmp/livliv/characters/d03ft/. app/src/main/assets/nana/model/
          rm -f app/src/main/assets/nana/model/cover.webp app/src/main/assets/nana/model/avatar.webp
          cp /tmp/livliv/characters/LICENSE.md app/src/main/assets/nana/LICENSE-characters.md
          cp /tmp/livliv/LICENSE app/src/main/assets/nana/LICENSE-player.txt
          cp /tmp/livliv/NOTICE app/src/main/assets/nana/NOTICE-player.txt
          npm install -g bun
          bun build /tmp/livliv/src/index.ts --outfile app/src/main/assets/nana/player.js --minify --target browser
          ls -la app/src/main/assets/nana app/src/main/assets/nana/model

      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mochi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mochi-apk
          path: mochi.apk

      # Publish as a GitHub Release so you can download it straight from your phone browser
      - name: Replace old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-build --cleanup-tag -y || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Mochi - latest build
          target_commitish: ${{ github.sha }}
          files: mochi.apk
          make_latest: true
