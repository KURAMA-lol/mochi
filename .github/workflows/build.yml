name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fetch sherpa-onnx native libs
        run: |
          set -e
          mkdir -p /tmp/sherpa && cd /tmp/sherpa
          curl -fL --retry 3 -o android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          tar xjf android.tar.bz2
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi"
            find . -path "*/$abi/*" -name "*.so" -exec cp {} "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/" \;
          done
          test -f "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so"
          ls -lR "$GITHUB_WORKSPACE/app/src/main/jniLibs"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mochi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mochi-apk
          path: mochi.apk

      # Publish as a GitHub Release so you can download it straight from your phone browser
      - name: Replace old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-build --cleanup-tag -y || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Mochi - latest build
          target_commitish: ${{ github.sha }}
          files: mochi.apk
          make_latest: true
