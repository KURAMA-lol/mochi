name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch LivLiv Player and Nana (not stored in this repo)
        run: |
          git clone https://github.com/livliv-dev/player /tmp/livliv
          git -C /tmp/livliv checkout e8a47e79a7358e4ae87208f20930442dc56fc6bc
          sed -i 's/^    if (!text) return$/    return/' /tmp/livliv/src/mark.ts
          grep -n '^    return$' /tmp/livliv/src/mark.ts
          mkdir -p app/src/main/assets/nana/model
          cp -r /tmp/livliv/characters/d03ft/. app/src/main/assets/nana/model/
          rm -f app/src/main/assets/nana/model/cover.webp app/src/main/assets/nana/model/avatar.webp
          cp /tmp/livliv/characters/LICENSE.md app/src/main/assets/nana/LICENSE-characters.md
          cp /tmp/livliv/LICENSE app/src/main/assets/nana/LICENSE-player.txt
          cp /tmp/livliv/NOTICE app/src/main/assets/nana/NOTICE-player.txt
          npm install -g bun
          bun build /tmp/livliv/src/index.ts --outfile app/src/main/assets/nana/player.js --minify --target browser
          ls -la app/src/main/assets/nana app/src/main/assets/nana/model

      - name: Fetch Agent-Reach (MIT, not stored in this repo)
        run: |
          git clone https://github.com/Panniantong/Agent-Reach /tmp/agentreach
          git -C /tmp/agentreach checkout c70ae6da5d39bc90e09ad2ae0575ccc89f31e284
          mkdir -p app/src/main/python
          cp -r /tmp/agentreach/agent_reach app/src/main/python/agent_reach
          cp /tmp/agentreach/LICENSE app/src/main/assets/nana/LICENSE-agent-reach.txt
          ls app/src/main/python app/src/main/python/agent_reach | head -40

      - name: Fetch sherpa-onnx (Apache-2.0, not stored in this repo)
        run: |
          set -e
          T=v1.13.8
          curl -sSL -o /tmp/sherpa.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/$T/sherpa-onnx-$T-android.tar.bz2
          mkdir -p /tmp/sherpa && tar xjf /tmp/sherpa.tar.bz2 -C /tmp/sherpa
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/sherpa/jniLibs/arm64-v8a/libonnxruntime.so /tmp/sherpa/jniLibs/arm64-v8a/libsherpa-onnx-jni.so app/src/main/jniLibs/arm64-v8a/
          git clone --depth 1 --branch $T https://github.com/k2-fsa/sherpa-onnx /tmp/sherpa-src
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          for f in KeywordSpotter OnlineRecognizer OnlineStream FeatureConfig Tts HomophoneReplacerConfig QnnConfig; do
            cp /tmp/sherpa-src/sherpa-onnx/kotlin-api/$f.kt app/src/main/java/com/k2fsa/sherpa/onnx/
          done
          cp /tmp/sherpa-src/LICENSE app/src/main/assets/nana/LICENSE-sherpa-onnx.txt
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/java/com/k2fsa/sherpa/onnx

      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mochi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mochi-apk
          path: mochi.apk

      # Publish as a GitHub Release so you can download it straight from your phone browser
      - name: Replace old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-build --cleanup-tag -y || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Mochi - latest build
          target_commitish: ${{ github.sha }}
          files: mochi.apk
          make_latest: true
