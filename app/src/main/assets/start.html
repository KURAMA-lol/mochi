<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nana's browser</title>
<style>
:root{--ac:#ff9f6e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#23252c 0%,#14151a 55%,#0e0f12 100%);color:#f2f3f5;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.w{width:100%;max-width:420px;text-align:center}
.dot{width:46px;height:46px;border-radius:50%;margin:0 auto 12px;background:var(--ac);box-shadow:0 0 28px color-mix(in srgb,var(--ac) 55%,transparent);position:relative}
.dot:before,.dot:after{content:"";position:absolute;top:19px;width:6px;height:9px;border-radius:50%;background:#14151a}
.dot:before{left:13px}.dot:after{right:13px}
h1{font-size:19px;margin:0 0 4px;color:var(--ac)}
p{margin:0 0 16px;font-size:12.5px;color:#9a9ca4}
form{margin:0 0 18px}
input{width:100%;padding:12px 16px;border-radius:999px;border:2px solid #2c2e36;background:#1b1c22;color:#f2f3f5;font-size:15px;outline:none}
input:focus{border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
a{display:block;padding:11px 6px;border-radius:14px;background:#1b1c22;border:1px solid #2c2e36;color:#f2f3f5;text-decoration:none;font-size:12.5px}
a:active{border-color:var(--ac)}
small{display:block;margin-top:18px;font-size:11px;color:#6d6f78}
</style></head>
<body><div class="w">
<div class="dot"></div>
<h1>Nana's browser</h1>
<p>Search or type a link. Nana can use this page too.</p>
<form id="f"><input id="q" type="text" placeholder="Search or type a link" autocomplete="off" autocapitalize="off" enterkeyhint="go"></form>
<div class="g">
<a href="https://www.youtube.com">YouTube</a>
<a href="https://en.wikipedia.org">Wikipedia</a>
<a href="https://github.com">GitHub</a>
<a href="https://maps.google.com">Maps</a>
<a href="https://news.google.com">News</a>
<a href="https://duckduckgo.com">DuckDuckGo</a>
</div>
<small>Nana never types your passwords. Log in yourself when she asks.</small>
</div>
<script>
(function(){
var m=/[?&]ac=([0-9a-fA-F]{6})/.exec(location.search);
if(m)document.documentElement.style.setProperty('--ac','#'+m[1]);
document.getElementById('f').addEventListener('submit',function(e){
 e.preventDefault();
 var s=document.getElementById('q').value.trim();if(!s)return;
 var u;
 if(/^https?:\/\//i.test(s))u=s;
 else if(s.indexOf(' ')<0&&s.indexOf('.')>0)u='https://'+s;
 else u='https://duckduckgo.com/?q='+encodeURIComponent(s);
 location.href=u;
});
})();
</script>
</body></html>
